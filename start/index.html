<style>
/* Tokens lifted from wardconsulting.ai/index.html so this page is the same object as the site. */
:root{
  --paper:#F2F3F0; --panel:#FFFFFF; --ink:#16201D; --muted:#56615C; --rule:#D5DAD5;
  --accent:#2F6B5A; --accent-ink:#FFFFFF; --brass:#9A6F22;
  --inset:#E3ECE7; --inset-rule:#C3D7CD; --warn-bg:#FBF4E4;
  --display:"Lexend",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --wrap:44rem;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1614; --panel:#16201D; --ink:#E8EDE9; --muted:#9BAAA2; --rule:#2B3A34;
    --accent:#6FC0A5; --accent-ink:#0F1614; --brass:#D9AE5A;
    --inset:#15241F; --inset-rule:#2F4A40; --warn-bg:#221C0E;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1614; --panel:#16201D; --ink:#E8EDE9; --muted:#9BAAA2; --rule:#2B3A34;
  --accent:#6FC0A5; --accent-ink:#0F1614; --brass:#D9AE5A;
  --inset:#15241F; --inset-rule:#2F4A40; --warn-bg:#221C0E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 16px}
header.bar{border-bottom:1px solid var(--rule);background:var(--panel)}
header.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:14px;padding-bottom:14px}
.brand{font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.01em}
.brand span{color:var(--muted);font-weight:400}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--rule);color:var(--muted);border-radius:999px;
  padding:6px 12px;font-size:.8rem;font-family:var(--display)}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
:where(a,button,input,select,textarea,[tabindex]):focus-visible{
  outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
main{padding:28px 0 80px}
.steps{display:flex;gap:6px;align-items:center;margin:0 0 6px;padding:0;list-style:none}
.steps li{height:4px;flex:1;background:var(--rule);border-radius:2px}
.steps li[data-on="1"]{background:var(--accent)}
.stepname{font-family:var(--display);font-size:.78rem;color:var(--muted);
  letter-spacing:.04em;text-transform:uppercase;margin:0 0 26px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,4.2vw,2rem);
  line-height:1.2;margin:0 0 10px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:34px 0 10px;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:.95rem;margin:0 0 4px}
p{margin:0 0 14px;max-width:62ch}
.help{color:var(--muted);font-size:.95rem;margin:-2px 0 18px}
.opts{display:flex;flex-direction:column;gap:10px;margin:22px 0 0;padding:0;list-style:none}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--rule);border-radius:10px;
  padding:14px 16px;color:var(--ink);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--inset);
  box-shadow:inset 3px 0 0 var(--accent)}
.opt .tick{flex:0 0 1.15rem;height:1.15rem;margin-top:.15rem;border:1px solid var(--rule);
  border-radius:4px;display:grid;place-items:center;font-size:.8rem;color:var(--accent-ink)}
.opt[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.opt .lab{flex:1}
input[type=text],input[type=email],input[type=url],textarea{
  width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--rule);
  border-radius:10px;padding:12px 14px;font-family:var(--body);font-size:1rem}
textarea{min-height:5.5rem;resize:vertical}
label.fl{display:block;font-family:var(--display);font-size:.85rem;color:var(--muted);margin:0 0 6px}
.nav{display:flex;gap:10px;align-items:center;margin:28px 0 0;flex-wrap:wrap}
.go{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);
  border-radius:999px;padding:11px 22px;font-family:var(--display);font-weight:600;font-size:.95rem}
.go[disabled]{opacity:.42;cursor:not-allowed}
.back{background:none;border:none;color:var(--muted);text-decoration:underline;padding:11px 2px;font-size:.9rem}
.mirror{border-left:3px solid var(--accent);background:var(--inset);
  padding:16px 18px;border-radius:0 10px 10px 0;margin:0 0 22px}
.mirror p{margin:0;font-size:1.06rem}
.mirror .tag{display:block;font-family:var(--display);font-size:.7rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;margin:0 0 14px}
.tierline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price{font-family:var(--mono);font-size:1.5rem;font-weight:500;color:var(--accent)}
.rows{list-style:none;margin:10px 0 0;padding:0}
.rows li{display:flex;gap:14px;padding:13px 0;border-top:1px solid var(--rule)}
.rows li:first-child{border-top:none}
.num{font-family:var(--mono);color:var(--muted);flex:0 0 1.6rem;font-size:.9rem}
.because{color:var(--muted);font-size:.9rem;margin:3px 0 0}
.chip{display:inline-block;font-family:var(--display);font-size:.68rem;letter-spacing:.05em;
  text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--inset-rule);
  background:var(--inset);color:var(--accent);margin-left:6px;vertical-align:1px}
.chip.est{background:var(--warn-bg);border-color:var(--brass);color:var(--brass)}
.money{font-family:var(--mono);font-size:.95rem}
table.q{width:100%;border-collapse:collapse;font-size:.95rem;margin:8px 0 0}
table.q th,table.q td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--rule)}
table.q th{font-family:var(--display);font-size:.78rem;letter-spacing:.03em;
  text-transform:uppercase;color:var(--muted);font-weight:500}
table.q td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
.scroller{overflow-x:auto}
.note{border:1px solid var(--rule);border-left:3px solid var(--brass);background:var(--warn-bg);
  border-radius:0 10px 10px 0;padding:14px 16px;margin:18px 0;font-size:.95rem}
.note strong{font-family:var(--display)}
.gaps{list-style:none;margin:8px 0 0;padding:0;font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.gaps li{padding:4px 0}
footer{border-top:1px solid var(--rule);color:var(--muted);font-size:.84rem;padding:22px 0 40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){
  .screen{animation:in .18s ease-out}
  @keyframes in{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>
</head>

<script>// ---- scoring engine, ported from score.py. PARITY IS TESTED, not assumed.
const TIERS={1:{name:"Start with Claude",price:99},2:{name:"Start Up",price:249},
  3:{name:"Build Your Swarm",price:4999},4:{name:"Run an Agent Fleet",price:9999}};
const DONE_FOR_YOU={name:"Done for you, per agent",
  why:"you told us nobody on your side would run it"};

function reflectionsFor(a,D){
  const out=[];
  for(const r of D.reflections){
    let ok=true;
    for(const [k,v] of Object.entries(r.when)){
      if(k==="pain"){ if(!(a.pains||[]).includes(v)) ok=false; }
      else if(k==="consequence"){ if(!Object.values(a.consequence||{}).includes(v)) ok=false; }
      else if(a[k]!==v) ok=false;
    }
    if(ok) out.push({id:r.id,text:r.text,because:r.when});
  }
  return out;
}

function scoreIt(a,D){
  const byPain={}; D.pains.forEach(p=>byPain[p.id]=p);
  const cw={}; D.consequences.forEach(o=>cw[o.v]=o);
  const patBy={}, patIdx={};
  D.patterns.forEach((p,i)=>{patBy[p.pattern]=p; patIdx[p.pattern]=i;});
  const door=a.door;
  const pains=(a.pains||[]).filter(p=>byPain[p]);
  const conseq=a.consequence||{};
  const gaps=[], weight={}, evidence={};

  for(const pid of pains){
    if(!byPain[pid].maps_to_patterns.length && door==="A"){
      gaps.push(pid==="ads_burn_money"
        ? "NO ADS AGENT YET: you said you can't tell which ads work. We do not have an ads agent ready for clients, so we cover this on the call. The first thing we check is whether conversion tracking is set up."
        : `NO AGENT YET for “${byPain[pid].label}”: nothing we have built fits this yet, so we cover it on the call rather than guess.`);
    }
    const cv=conseq[pid];
    if(cv==null){ gaps.push(`NO DATA: no consequence answer for pain '${pid}', so it carries no weight`); continue; }
    const w=cw[cv].w;
    for(const pat of byPain[pid].maps_to_patterns){
      if(!patBy[pat]){ gaps.push(`NO DATA: pain '${pid}' maps to '${pat}' which is not in the catalogue`); continue; }
      weight[pat]=(weight[pat]||0)+w;
      (evidence[pat]=evidence[pat]||[]).push({pain:byPain[pid].label,consequence:cw[cv].label,weighs:cw[cv].weight});
    }
  }
  const add=(pat,why,w=3)=>{ if(!patBy[pat])return; weight[pat]=(weight[pat]||0)+w;
    (evidence[pat]=evidence[pat]||[]).push({answer:why}); };
  if(a.quotes_jobs==="yes") add("estimator","they price or quote jobs individually");
  if(a.price_list==="yes"||a.price_list==="none") add("price-book","their price list is stale or does not exist");
  if((a.reviews_now||[]).includes("dont")) add("reviews","they do not ask for reviews today");
  const site=(a.website||"").trim();
  const hasSite=/^(https?:\/\/)?(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}(\/\S*)?$/i.test(site);
  if(hasSite) add("website","they have a live site",2);

  for(const pat of Object.keys(weight)){
    if(patBy[pat].blocked){ gaps.push(`CANNOT OFFER ${pat}: ${patBy[pat].blocked}`); delete weight[pat]; delete evidence[pat]; }
  }
  if(site && !hasSite && ("website" in weight)){
    delete weight["website"]; delete evidence["website"];
    gaps.push("NO WEBSITE YET: you told us you do not have a site, so a site audit cannot help yet. The first step is a simple website and a Google Business Profile.");
  } else if(site && !hasSite){
    gaps.push("NO WEBSITE YET: you told us you do not have a site.");
  }
  const forced=[];
  for(const pat of Object.keys(weight)){
    for(const dep of patBy[pat].depends_on||[]){
      if(patBy[dep] && !patBy[dep].blocked && !(dep in weight)){
        weight[dep]=weight[dep]||0;
        (evidence[dep]=evidence[dep]||[]).push({answer:`required by ${pat} - it cannot run without it`});
        forced.push({added:dep,because_of:pat});
      }
    }
  }
  const ordered=Object.keys(weight).sort((x,y)=>(weight[y]-weight[x])||(patIdx[x]-patIdx[y]));
  const out=[], placed=new Set();
  const place=p=>{ if(placed.has(p))return;
    for(const dep of patBy[p].depends_on||[]) if(dep in weight) place(dep);
    placed.add(p); out.push(p); };
  ordered.forEach(place);
  let shortlist=out.filter(p=>(evidence[p]||[]).length).map(p=>({
    pattern:p,callsign:patBy[p].callsign,job:patBy[p].job,weight:weight[p],
    why:evidence[p],provenance:patBy[p].provenance,install_state:patBy[p].install_state,
    data_prereq:patBy[p].data_prereq,never:patBy[p].never,
    setup_band:patBy[p].setup_band,care_band:patBy[p].care_band}));

  const mat=a.ai_maturity, runs=a.who_runs;
  let tier=null,tier_why=null,offer=null,also=null;
  const pains_named=pains.length>0;
  if((door==="B"||door==="C") && (a.idea_paying==="not_asked"||a.idea_paying==="no")){
    tier=2; also=1;
    tier_why="nobody has said they would pay for it yet, so this is two hours with us working out how to find that out - not a build, and not a build quote";
    shortlist=[];
    gaps.push("NO AGENT SHORTLIST: we do not have a client-proven agent for an unvalidated idea.");
    gaps.push("CEILING: an unvalidated idea is never recommended Build Your Swarm or Run an Agent Fleet, whatever else the answers say.");
  } else if((door==="B"||door==="C") && (a.idea_paying==="paid"||a.idea_paying==="said_yes")){
    const paid=a.idea_paying==="paid";
    if((runs==="me"||runs==="staff") && (mat==="daily"||mat==="built"||paid)){
      tier=3; also=2;
      tier_why=paid?"someone has already paid for this, so it is a real product and you are the one who will build it"
                   :"people have said they would pay, and someone named will build it";
    } else { tier=2; also=1; tier_why="there is real demand for the idea and you want it working"; }
  } else if(door==="E" && !pains_named){
    tier=1; also=null;
    tier_why="you came to look and did not name anything that is costing you, so start cheap";
  } else if(runs==="nobody"){
    offer=DONE_FOR_YOU; also=3;
    tier_why="nobody on your side would run it, so training is the wrong product";
  } else if(door==="A" && shortlist.length>=5 && (a.headcount==="6_20"||a.headcount==="20p")
            && (mat==="daily"||mat==="built")){
    tier=4; also=3;
    tier_why="enough lanes, enough people, and you already build - this is the governance one";
  } else if(door==="A" && shortlist.length>=3 && (runs==="me"||runs==="staff")){
    tier=3; also=2;
    tier_why="you named several things that are agent-shaped and someone on your side will run them, so the one that actually builds agents is the fit";
  } else if(door==="D"){
    tier=2; also=1;
    tier_why="a personal workflow in your own job, not a business fleet";
    if(a.job_allowed==="no") gaps.push("HARD LIMIT: your employer does not allow AI with work information. Nothing in this plan may touch employer data.");
  } else {
    tier=2; also=1;
    tier_why="you named something that is costing you, and the live session is where that gets addressed - the self-paced page would not touch it";
  }
  if(mat==="never" && tier && tier>2){
    tier=2; also=1;
    tier_why="you have never used it, and our own ladder says Build Your Swarm expects the live session or equivalent first - so this is the honest starting point";
  }

  const core=["door","pains","consequence","ai_maturity","who_runs"].filter(k=>a[k]).length;
  if(core<4) gaps.push("NO DATA: fewer than four core answers, so this is a first read, not an assessment");
  // Confidence follows the gaps actually listed, so it can never read LOW over "nothing flagged".
  let confidence = gaps.length ? "LOW" : "MEDIUM";

  let ls=0;
  ls+=({now:5,quarter:3,someday:1})[a.timeline]||0;
  ls+=({nobody:5,staff:3,me:2})[runs]||0;
  ls+=({"20p":4,"6_20":3,"2_5":2,"1":1})[a.headcount]||0;
  ls+=Math.min((a.channels||[]).length,3);
  ls+=Object.values(evidence).some(ev=>ev.some(e=>e.weighs==="money"))?3:0;
  ls+=a.idea_paying==="paid"?2:0;
  ls+=({over_2000:3,"500_2000":2,"100_500":1})[a.monthly_cost]||0;

  return {door,tier_recommended:tier?Object.assign({tier},TIERS[tier]):null,
    also_available:also?Object.assign({tier:also},TIERS[also]):null,offer,tier_why,
    agent_shortlist:shortlist,dependencies_forced:forced,
    reflections:reflectionsFor(a,D),
    their_words:{monthly_cost:((D.questions.find(q=>q.id==="monthly_cost")||{options:[]}).options
      .find(o=>o.v===a.monthly_cost)||{}).label},
    confidence,lead_score:ls,gaps,
    not_promised:"No result, revenue, saving or income is promised. Every agent starts propose-only: it drafts, you approve anything that reaches a customer or changes a price.",
    not_installed_anywhere:shortlist.map(s=>s.pattern),
    internal_only_in_shortlist:shortlist.filter(s=>s.provenance==="internal-lane").map(s=>s.pattern)};
}

function quoteFor(shortlist,D){
  const P=D.pricing, patBy={}; D.patterns.forEach(p=>patBy[p.pattern]=p);
  const lines=[],separate=[];
  let setup=0,care=0;
  for(const s of shortlist){
    const amt=P.setup[s.setup_band];
    if(amt==null){ separate.push(s); continue; }
    setup+=amt; care+=P.care[s.care_band];
    lines.push({...s,setup:amt,care_per_month:P.care[s.care_band]});
  }
  const n=lines.length;
  const disc=n>=5?0.10:(n>=3?0.05:0);
  const after=Math.round(setup*(1-disc));
  return {lines,separate,onboarding:P.onboarding,setup_before:setup,discount_pct:Math.round(disc*100),
    setup:after,care_per_month:care,months:P.min_months,
    one_time:P.onboarding+after,total_term:P.onboarding+after+care*P.min_months};
}
</script>
<script>(function(){
"use strict";
var D=JSON.parse(document.getElementById("DATA").textContent);
var CFG={"form_endpoint":"https://formsubmit.co/ajax/7fbd7e6f9b9178360b909504bd877f07","min_seconds_before_send":25};
var Q={}; D.questions.forEach(function(q){Q[q.id]=q;});
var KEY="wc-intake-v1";
var A={}, step=0, pendingPain=0, shownRefl={};

try{var t=localStorage.getItem(KEY+"-theme"); if(t)document.documentElement.dataset.theme=t;}catch(e){}
function paintTheme(){
  var d=document.documentElement.dataset.theme;
  var dark = d==="dark" || (!d && matchMedia("(prefers-color-scheme:dark)").matches);
  document.getElementById("theme").textContent = dark?"Light":"Dark";
}
document.getElementById("theme").onclick=function(){
  var d=document.documentElement.dataset.theme;
  var dark = d==="dark" || (!d && matchMedia("(prefers-color-scheme:dark)").matches);
  document.documentElement.dataset.theme = dark?"light":"dark";
  try{localStorage.setItem(KEY+"-theme",document.documentElement.dataset.theme);}catch(e){}
  paintTheme();
};
paintTheme();

function save(){ try{localStorage.setItem(KEY,JSON.stringify({A:A,step:step,pendingPain:pendingPain,shownRefl:shownRefl}));}catch(e){} }
function restore(){ try{var r=JSON.parse(localStorage.getItem(KEY)||"null");
  if(r&&r.A&&Object.keys(r.A).length){A=r.A;step=r.step||0;pendingPain=r.pendingPain||0;shownRefl=r.shownRefl||{};return true;} }catch(e){} return false; }

var SECTIONS=["Where you're starting","What's hurting","Your situation","You and AI","Your result"];
function doorSpine(){
  var d=A.door;
  return D.questions.filter(function(q){
    if(!q.doors.includes(d)) return false;
    if(["door","pain","consequence","monthly_cost","ai_maturity","who_runs","timeline","email_consent"].includes(q.id)) return false;
    // Business questions only for owners: door A is an owner by definition; other doors say so.
    var owner = d==="A" || A.owns_business==="yes";
    if((q.id==="headcount"||q.id==="pay_bands") && !owner) return false;
    if(q.id==="pay_bands" && A.headcount==="1") return false;
    return true;
  }).map(function(q){return q.id;});
}
function plan(){
  var s=[{k:"intro"},{k:"ask",id:"door"}];
  if(!A.door) return s;
  s.push({k:"ask",id:"pain"});
  (A.pains||[]).forEach(function(p,i){ s.push({k:"conseq",pain:p,i:i}); });
  if((A.pains||[]).length){ s.push({k:"mirror"}); if(Q.monthly_cost.doors.includes(A.door)) s.push({k:"ask",id:"monthly_cost"}); }
  doorSpine().forEach(function(id){ s.push({k:"ask",id:id}); });
  s.push({k:"ask",id:"ai_maturity"},{k:"ask",id:"who_runs"},{k:"ask",id:"timeline"},
         {k:"result"});
  return s;
}
function sectionOf(st){
  if(!st) return 0;
  if(st.k==="intro"||(st.k==="ask"&&st.id==="door")) return 0;
  if(st.k==="conseq"||st.k==="mirror"||(st.k==="ask"&&(st.id==="pain"||st.id==="monthly_cost"))) return 1;
  if(st.k==="ask"&&["ai_maturity","who_runs","timeline"].includes(st.id)) return 3;
  if(st.k==="result") return 4;
  return 2;
}

function el(tag,attrs,txt){ var n=document.createElement(tag);
  if(attrs) for(var k in attrs){ if(k==="html") n.innerHTML=attrs[k]; else n.setAttribute(k,attrs[k]); }
  if(txt!=null) n.textContent=txt; return n; }

function render(){
  var P=plan(); if(step>=P.length) step=P.length-1; if(step<0) step=0;
  var st=P[step], host=document.getElementById("q");
  host.innerHTML=""; host.className="screen";
  var sIdx=sectionOf(st), ul=document.getElementById("steps"); ul.innerHTML="";
  SECTIONS.forEach(function(_,i){ ul.appendChild(el("li",{"data-on":i<=sIdx?"1":"0"})); });
  document.getElementById("stepname").textContent =
    "Section "+(sIdx+1)+" of "+SECTIONS.length+" · "+SECTIONS[sIdx];

  if(st.k==="intro") return intro(host);
  if(st.k==="conseq") return conseq(host,st);
  if(st.k==="mirror") return mirror(host);
  if(st.k==="result") return result(host);
  return ask(host,Q[st.id]);
}

function navRow(host,onNext,enabled,label){
  var nav=el("div",{class:"nav"});
  var b=el("button",{class:"go",type:"button"},label||"Continue");
  if(!enabled) b.disabled=true;
  b.onclick=onNext; nav.appendChild(b);
  if(step>0){ var k=el("button",{class:"back",type:"button"},"Back");
    k.onclick=function(){ step--; save(); render(); window.scrollTo(0,0); }; nav.appendChild(k); }
  host.appendChild(nav); return b;
}
function next(){ step++; save(); render(); window.scrollTo(0,0); }

function intro(host){
  host.appendChild(el("h1",null,"What AI agents can we create for you?"));
  host.appendChild(el("p",null,"About fifteen questions. Four minutes. We work out which ones would earn their place, and in what order. You get the answer on screen before we ask for your email."));
  host.appendChild(el("p",null,"Sometimes the honest answer is none yet, and we will tell you that instead of quoting you. You also do not need to own a business: if you have an idea, a job you want help with, or you are just curious, there is a path here for you."));
  var n=el("div",{class:"note"});
  n.appendChild(el("strong",null,"What this is not. "));
  n.appendChild(document.createTextNode("We do not promise results, revenue, savings or hours. Your answers stay in this browser until you decide to send them."));
  host.appendChild(n);
  var resumed = (A&&Object.keys(A).length);
  navRow(host,next,true, resumed?"Pick up where you left off":"Start");
}

function ask(host,q){
  if(!q) { next(); return; }
  host.appendChild(el("h1",null,q.text));
  if(q.help) host.appendChild(el("p",{class:"help"},q.help));
  var KEY = q.id==="pain" ? "pains" : q.id;
  var val = q.id==="pain" ? (A.pains||A.pain) : A[q.id];

  if(q.type==="single"){
    var ul=el("ul",{class:"opts"});
    q.options.forEach(function(o){
      var li=el("li"), b=el("button",{class:"opt",type:"button","aria-pressed":val===o.v?"true":"false"});
      b.appendChild(el("span",{class:"tick","aria-hidden":"true"},val===o.v?"✓":""));
      b.appendChild(el("span",{class:"lab"},o.label));
      b.onclick=function(){ A[q.id]=o.v;
        if(q.id==="owns_business" && o.v!=="yes"){ delete A.headcount; delete A.pay_bands; }
        if(q.id==="headcount" && o.v==="1") delete A.pay_bands;
        save(); next(); };
      li.appendChild(b); ul.appendChild(li);
    });
    host.appendChild(ul);
    if(q.optional) navRow(host,function(){ next(); },true,"Skip this one");
    return;
  }
  if(q.type==="multi"){
    var picked=(val||[]).slice();
    var ul2=el("ul",{class:"opts"}), go;
    var src = q.id==="pain" ? D.pains.filter(function(p){return p.doors.includes(A.door);})
                               .map(function(p){return {v:p.id,label:p.label};})
                            : q.options;
    src.forEach(function(o){
      var li=el("li"), b=el("button",{class:"opt",type:"button","aria-pressed":picked.includes(o.v)?"true":"false"});
      b.appendChild(el("span",{class:"tick","aria-hidden":"true"},picked.includes(o.v)?"✓":""));
      b.appendChild(el("span",{class:"lab"},o.label));
      b.onclick=function(){
        var i=picked.indexOf(o.v);
        if(i>=0) picked.splice(i,1);
        else { if(q.max_pick&&picked.length>=q.max_pick) return; picked.push(o.v); }
        b.setAttribute("aria-pressed",picked.includes(o.v)?"true":"false");
        b.firstChild.textContent=picked.includes(o.v)?"✓":"";
        if(go) go.disabled=picked.length===0;
      };
      li.appendChild(b); ul2.appendChild(li);
    });
    host.appendChild(ul2);
    if(q.max_pick) host.appendChild(el("p",{class:"help"},"Pick up to "+Math.min(q.max_pick,src.length)+"."));
    go=navRow(host,function(){
      A[KEY]=picked;
      if(q.id==="pain"){ delete A.pain; A.consequence=A.consequence||{};
        Object.keys(A.consequence).forEach(function(k){ if(!picked.includes(k)) delete A.consequence[k]; }); }
      save(); next();
    },picked.length>0);
    return;
  }
  if(q.type==="text"||q.type==="url"){
    var lab=el("label",{class:"fl",for:"f"},q.optional?"Optional":"Your answer");
    var inp = q.maxlen>120 ? el("textarea",{id:"f",maxlength:String(q.maxlen||300)})
                           : el("input",{id:"f",type:q.type==="url"?"url":"text",maxlength:String(q.maxlen||120)});
    inp.value=val||"";
    host.appendChild(lab); host.appendChild(inp);
    var g=navRow(host,function(){ var v=inp.value.trim();
      if(v) A[q.id]=v; else delete A[q.id]; save(); next(); },true, q.optional?"Continue":"Continue");
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter"&&q.maxlen<=120){ e.preventDefault(); g.click(); } });
    setTimeout(function(){ inp.focus(); },40);
    return;
  }
  next();
}

function conseq(host,st){
  var pain=D.pains.find(function(p){return p.id===st.pain;});
  host.appendChild(el("h1",null,"“"+pain.label+"”"));
  host.appendChild(el("p",null,"When that happens, what goes wrong?"));
  A.consequence=A.consequence||{};
  var cur=A.consequence[st.pain];
  var ul=el("ul",{class:"opts"});
  D.consequences.forEach(function(o){
    var li=el("li"), b=el("button",{class:"opt",type:"button","aria-pressed":cur===o.v?"true":"false"});
    b.appendChild(el("span",{class:"tick","aria-hidden":"true"},cur===o.v?"✓":""));
    b.appendChild(el("span",{class:"lab"},o.label));
    b.onclick=function(){ A.consequence[st.pain]=o.v; save(); next(); };
    li.appendChild(b); ul.appendChild(li);
  });
  host.appendChild(ul);
  if(step>0){ var nav=el("div",{class:"nav"}); var k=el("button",{class:"back",type:"button"},"Back");
    k.onclick=function(){ step--; save(); render(); }; nav.appendChild(k); host.appendChild(nav); }
}

function mirror(host){
  var refl=scoreIt(A,D).reflections;
  if(!refl.length){ next(); return; }
  host.appendChild(el("h1",null,"So, reading that back"));
  refl.slice(0,3).forEach(function(r){
    var m=el("div",{class:"mirror"});
    m.appendChild(el("span",{class:"tag"},"what that tells us"));
    m.appendChild(el("p",null,r.text));
    host.appendChild(m);
  });
  navRow(host,next,true,"That's about right");
}

function noPrice(t){ if(!t) return t; var o={}; for(var k in t) if(k!=="price") o[k]=t[k]; return o; }
var START=Date.now();

function demandKind(){
  var d=A.door, p=A.idea_paying;
  if((d==="B"||d==="C") && (p==="paid"||p==="said_yes")) return "validated";
  if(d==="B"||d==="C") return "unvalidated";
  return "other";
}
function noListText(){
  var k=demandKind();
  if(k==="validated") return {head:"Next, we work out what to build",
    body:"People have told you they would pay, so the next step is a working session to decide what gets built first. We do not have a ready-made agent for this; we would design it with you."};
  if(k==="unvalidated") return {head:"We are not going to sell you agents yet",
    body:"On what you have told us, the next step is not building anything. It is finding out whether one person will pay for this, which costs nothing and takes a week. We would rather tell you that than quote you for a build."};
  return {head:"We do not have a ready-made agent for this yet",
    body:"None of the agents we have written fits what you told us. Send us your answers and we will tell you plainly whether we can build one."};
}
function summaryText(r){
  var L=[];
  L.push("WHAT WE WOULD DO FIRST");
  L.push("");
  if(r.their_words.monthly_cost) L.push("What it costs you a month, roughly: "+r.their_words.monthly_cost);
  L.push("Where to start: "+(r.offer?r.offer.name:r.tier_recommended.name));
  L.push("Why: "+r.tier_why);
  if(r.also_available) L.push("If you would rather start smaller: "+r.also_available.name);
  L.push("");
  if(r.agent_shortlist.length){
    L.push("THE AGENTS, IN THIS ORDER (anything another depends on comes first)");
    r.agent_shortlist.forEach(function(s,i){
      L.push((i+1)+". "+s.callsign+" - "+s.job);
      L.push("   because "+s.why.map(function(w){return w.pain?("you said \u201c"+w.pain+"\u201d"):w.answer;}).join("; "));
      L.push("   needs: "+s.data_prereq);
      L.push("   never: "+s.never);
      L.push("   "+(s.provenance==="client-charter"
        ? "charter written for a client and ready to install - NOT yet installed for anyone"
        : "we run this ourselves; not yet adapted for a client"));
    });
    L.push("");
  } else {
    var nx=noListText(); L.push(nx.head.toUpperCase()); L.push(nx.body);
    L.push("");
  }
  L.push("WHAT WE STILL DO NOT KNOW (confidence: "+r.confidence+")");
  (r.gaps.length?r.gaps:["Nothing missing from your answers. This is still the quick read; a 20-minute call is what makes it firm."]).forEach(function(g){L.push("- "+g);});
  L.push("");
  L.push("WHAT WE ARE NOT PROMISING");
  L.push(r.not_promised);
  return L.join("\n");
}

function offerFallback(host,payload,r){
  if(host.querySelector("[data-fallback]")) return;
  var nav=el("div",{class:"nav","data-fallback":"1"});
  var cp=el("button",{class:CFG.form_endpoint?"back":"go",type:"button"},"Copy my answers");
  cp.onclick=function(){
    var done=function(){ cp.textContent="Copied \u2014 now paste it to us"; };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(payload).then(done,fb);
    } else fb();
    function fb(){
      var ta=el("textarea"); ta.value=payload;
      ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(ta); ta.select();
      try{document.execCommand("copy"); done();}catch(e){ cp.textContent="Select and copy the box below";
        var box=el("textarea"); box.value=payload; host.appendChild(box); }
      ta.remove();
    }
  };
  nav.appendChild(cp);
  var subj="Questionnaire result"+(A.biz_name?(" \u2014 "+A.biz_name):"");
  var body="Here are my answers from wardconsulting.ai\n\n"+summaryText(r)+"\n\n---\n"+payload;
  nav.appendChild(el("a",{class:"back",href:"mailto:"+["chris","z-clear.com"].join("@")+"?subject="+
    encodeURIComponent(subj)+"&body="+encodeURIComponent(body.slice(0,1400))},"or open an email"));
  var rs=el("button",{class:"back",type:"button"},"Start over");
  rs.onclick=function(){ if(!confirm("Clear your answers and start again?"))return;
    try{localStorage.removeItem(KEY);}catch(e){} A={};step=0;shownRefl={};render(); };
  nav.appendChild(rs);
  host.appendChild(nav);
}

function result(host){
  var r=scoreIt(A,D);
  host.appendChild(el("h1",null,"Here is what we would do first"));

  if(r.their_words.monthly_cost){
    var m=el("div",{class:"mirror"});
    m.appendChild(el("span",{class:"tag"},"what you told us this costs you a month"));
    m.appendChild(el("p",null,r.their_words.monthly_cost));
    host.appendChild(m);
  }

  var c=el("div",{class:"card"});
  if(r.offer){
    c.appendChild(el("h3",null,"Our recommendation"));
    var tl=el("div",{class:"tierline"});
    tl.appendChild(el("strong",{class:"price"},r.offer.name));
    c.appendChild(tl);
    c.appendChild(el("p",{class:"because"},r.offer.why));
  } else {
    c.appendChild(el("h3",null,"Where to start"));
    var tl2=el("div",{class:"tierline"});
    tl2.appendChild(el("span",{style:"font-family:var(--display);font-weight:600;font-size:1.1rem"},r.tier_recommended.name));
    c.appendChild(tl2);
  }
  c.appendChild(el("p",{class:"because",style:"margin-top:8px"},"Why: "+r.tier_why));
  host.appendChild(c);

  if(r.also_available){
    var alt=el("div",{class:"card",style:"background:var(--inset);border-color:var(--inset-rule)"});
    alt.appendChild(el("h3",null,"If you would rather start smaller"));
    var al=el("div",{class:"tierline"});
    al.appendChild(el("span",{style:"font-family:var(--display);font-weight:600"},r.also_available.name));
    alt.appendChild(al);
    alt.appendChild(el("p",{class:"because",style:"margin-top:6px"},
      r.also_available.tier===1
        ? "Self-paced, about an hour and a half, on your own. It will not address the specific thing you named above — it gets you comfortable with Claude. Plenty of people start here."
        : "A smaller step on the same path. You can move up later; nothing is wasted."));
    host.appendChild(alt);
  }

  if(r.agent_shortlist.length){
    host.appendChild(el("h2",null,"The agents we would build, in this order"));
    host.appendChild(el("p",{class:"help"},"The order is not arbitrary. Anything that another agent depends on comes first."));
    var ul=el("ul",{class:"rows"});
    r.agent_shortlist.forEach(function(s,i){
      var li=el("li");
      li.appendChild(el("span",{class:"num"},String(i+1)));
      var d=el("div");
      var h=el("h3",null,s.callsign);
      if(s.provenance==="client-charter")
        h.appendChild(el("span",{class:"chip"},"charter written, not yet installed"));
      else h.appendChild(el("span",{class:"chip est"},"we run this ourselves"));
      d.appendChild(h);
      d.appendChild(el("p",{style:"margin:2px 0 0"},s.job));
      var why=s.why.map(function(w){ return w.pain ? "you said “"+w.pain+"”" : w.answer; }).join("; ");
      d.appendChild(el("p",{class:"because"},"Because "+why+"."));
      d.appendChild(el("p",{class:"because"},"Needs: "+s.data_prereq));
      d.appendChild(el("p",{class:"because"},"Never: "+s.never));
      li.appendChild(d); ul.appendChild(li);
    });
    host.appendChild(ul);

    if(r.dependencies_forced.length){
      var dn=el("div",{class:"note"});
      dn.appendChild(el("strong",null,"We added something you did not ask for. "));
      dn.appendChild(document.createTextNode(r.dependencies_forced.map(function(f){
        return f.added+", because "+f.because_of+" cannot run without it";}).join("; ")+"."));
      host.appendChild(dn);
    }

    var un=el("div",{class:"note"});
    un.appendChild(el("strong",null,"Being straight with you. "));
    un.appendChild(document.createTextNode(
      "None of these is running for anyone yet. The ones marked \u201ccharter written\u201d are "+
      "fully specified and ready to install; you would be the first."+
      (r.internal_only_in_shortlist.length
        ? " And "+r.internal_only_in_shortlist.join(", ")+" we run in our own business but have "+
          "never adapted for a client, so we would scope those with you first."
        : "")));
    host.appendChild(un);
  } else {
    var nx2=noListText();
    host.appendChild(el("h2",null,nx2.head));
    host.appendChild(el("p",null,nx2.body));
  }

  host.appendChild(el("h2",null,"Your first two weeks"));
  var wk=el("ul",{class:"rows"});
  function week(n,title,items){
    var li=el("li"); li.appendChild(el("span",{class:"num"},"W"+n));
    var d=el("div"); d.appendChild(el("h3",null,title));
    items.forEach(function(t){ d.appendChild(el("p",{class:"because",style:"margin:3px 0 0"},"\u00b7 "+t)); });
    li.appendChild(d); wk.appendChild(li);
  }
  if(r.agent_shortlist.length){
    var a1=r.agent_shortlist[0], a2=r.agent_shortlist[1];
    week(1,"Get "+a1.callsign+" running",[
      "Gather what it needs: "+a1.data_prereq,
      "We set it up in your own Claude account, with you watching",
      "It runs once and drafts. You approve or correct that first draft \u2014 nothing goes out on its own",
      "Remember what it will never do: "+a1.never]);
    if(a2){
      week(2,"Add "+a2.callsign+", and check "+a1.callsign+" is being used",[
        "Gather: "+a2.data_prereq,
        a1.callsign+" has a week of drafts by now \u2014 we look at what you corrected and fix the cause, not the draft",
        "If "+a1.callsign+" is not being used, we stop and find out why before adding anything else"]);
    } else {
      week(2,"Make sure it is actually being used",[
        a1.callsign+" has a week of drafts \u2014 we look at what you corrected and fix the cause",
        "Only then do we talk about a second one. One agent in daily use beats three nobody opens"]);
    }
  } else {
    var dm=demandKind();
    if(dm==="validated"){
    week(1,"Decide what gets built first",[
      "Write down what your first paying customer gets on day one",
      "List what it must do now and what can wait",
      "Bring both to a working session with us"]);
    week(2,"Turn it into a build plan",[
      "We agree what gets built, in what order, and who runs it",
      "Nothing is built until you have approved that plan"]);
    } else if(dm==="other"){
    week(1,"Tell us more",[
      "Send us your answers below",
      "We reply plainly: whether we can build something for this, and what it would take"]);
    week(2,"Decide together",[
      "If we can help, we agree the first step with you",
      "If we cannot, we tell you, and point you to what would"]);
    } else {
    week(1,"Find out if anyone will pay",[
      "Write down the one sentence that describes it, and who it is for",
      "Talk to five people who look like that. Ask what they do today and what it costs them",
      "Ask one of them, plainly, whether they would pay for it"]);
    week(2,"Come back with what they said",[
      "If anyone said yes, that changes everything and we talk about building",
      "If nobody did, you have saved yourself the build \u2014 that is the week working, not failing"]);
    }
  }
  host.appendChild(wk);

  var np=el("div",{class:"note"});
  np.appendChild(el("strong",null,"What we are not promising. "));
  np.appendChild(document.createTextNode(r.not_promised));
  host.appendChild(np);

  host.appendChild(el("h2",null,"What we still do not know"));
  host.appendChild(el("p",{class:"help"},"Confidence from these answers alone: "+r.confidence+
    (r.gaps.length?". The reasons are listed below.":". Nothing is missing from your answers.")));
  var gl=el("ul",{class:"gaps"});
  (r.gaps.length?r.gaps:["Nothing missing from your answers. This is still the quick read; a 20-minute call is what makes it firm."])
    .forEach(function(g){ gl.appendChild(el("li",null,g)); });
  host.appendChild(gl);

  host.appendChild(el("h2",null,"Send this to us"));
  var payloadObj={answers:A,result:{
    tier:noPrice(r.tier_recommended),also:noPrice(r.also_available),offer:noPrice(r.offer),why:r.tier_why,
    shortlist:r.agent_shortlist.map(function(s){return s.pattern;}),
    lead_score:r.lead_score,confidence:r.confidence,gaps:r.gaps}};
  var payload=JSON.stringify(payloadObj,null,1);

  if(CFG.form_endpoint){
    host.appendChild(el("p",null,"Put your email in and send your answers to us. We read every one and come back to you with the plan. Nothing has left your browser yet."));
    var f=el("form",{novalidate:"novalidate"});
    var lab=el("label",{class:"fl",for:"em"},"Your email");
    var em=el("input",{id:"em",type:"email",autocomplete:"email",required:"required"});
    em.value=A.email||"";
    var labP=el("label",{class:"fl",for:"ph",style:"margin-top:12px"},"Phone (optional)");
    var ph=el("input",{id:"ph",type:"tel",autocomplete:"tel",maxlength:"30"});
    ph.value=A.phone||"";
    var labT=el("label",{class:"fl",for:"bt",style:"margin-top:12px"},"Best time to call (optional)");
    var bt=el("input",{id:"bt",type:"text",maxlength:"80",placeholder:"e.g. weekday mornings"});
    bt.value=A.best_time||"";
    var hp=el("input",{type:"text",name:"_honey",tabindex:"-1","aria-hidden":"true",
      autocomplete:"off",style:"position:absolute;left:-9999px;width:1px;height:1px;opacity:0"});
    var cons=el("label",{class:"opt",style:"margin-top:12px"});
    var cb=el("input",{type:"checkbox",id:"cons"});
    cons.appendChild(cb);
    cons.appendChild(el("span",{class:"lab"},"Email me my result and a plan. You may also contact me about it."));
    f.appendChild(lab); f.appendChild(em);
    f.appendChild(labP); f.appendChild(ph); f.appendChild(labT); f.appendChild(bt);
    f.appendChild(hp); f.appendChild(cons);
    var msg=el("p",{class:"help","role":"status","aria-live":"polite"},"");
    var send=el("button",{class:"go",type:"submit",style:"margin-top:18px"},"Send my answers");
    f.appendChild(send); f.appendChild(msg);
    host.appendChild(f);
    host.appendChild(el("p",{class:"help"},"We do not sell or share your address. Ask us to delete it any time and we will."));
    f.onsubmit=function(ev){
      ev.preventDefault();
      var v=(em.value||"").trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){ msg.textContent="That email does not look right \u2014 check it and try again."; em.focus(); return; }
      if(!cb.checked){ msg.textContent="Tick the box so we are allowed to email you."; cb.focus(); return; }
      if(hp.value){ msg.textContent="Sent."; return; }   // bot: say nothing useful
      var secs=(Date.now()-START)/1000;
      if(secs<(CFG.min_seconds_before_send||25)){ msg.textContent="Sent."; return; }
      A.email=v;
      var pv=(ph.value||"").trim(), tv=(bt.value||"").trim();
      if(pv) A.phone=pv; else delete A.phone;
      if(tv) A.best_time=tv; else delete A.best_time;
      save();
      send.disabled=true; msg.textContent="Sending\u2026";
      var body=new FormData();
      body.append("email",v);
      body.append("_subject","Questionnaire answers"+(A.biz_name?(" \u2014 "+A.biz_name):"")+" ("+v+")");
      body.append("_template","table");
      body.append("_honey","");
      body.append("name",A.biz_name||"");
      body.append("phone",A.phone||"");
      body.append("best_time",A.best_time||"");
      body.append("monthly_cost",r.their_words.monthly_cost||"");
      body.append("business_owner",A.door==="A"?"yes":(A.owns_business||""));
      var lbl=function(qid,v){ var o=(Q[qid].options||[]).find(function(x){return x.v===v;}); return o?o.label:v; };
      body.append("headcount",A.headcount?lbl("headcount",A.headcount):"");
      body.append("pay_bands",(A.pay_bands||[]).map(function(v){return lbl("pay_bands",v);}).join("; "));
      body.append("door",r.door||"");
      body.append("recommended", r.offer?r.offer.name:(r.tier_recommended?r.tier_recommended.name:""));
      body.append("also_available", r.also_available?r.also_available.name:"");
      body.append("lead_score",String(r.lead_score));
      body.append("confidence",r.confidence);
      body.append("website",A.website||"");
      body.append("result_summary",summaryText(r));
      body.append("payload_json",payload);
      fetch(CFG.form_endpoint,{method:"POST",body:body,headers:{Accept:"application/json"}})
        .then(function(res){
          if(!res.ok) throw new Error("status "+res.status);
          return res.json().catch(function(){ return {}; });
        })
        .then(function(j){
          if(j&&(j.success===false||j.success==="false")) throw new Error(j.message||"not accepted");
          msg.textContent="Sent. We have your answers and will come back to you by email.";
          send.textContent="Sent";
        })
        .catch(function(e){
          send.disabled=false; send.textContent="Try again";
          msg.textContent="That did not go through ("+e.message+"). Nothing is lost \u2014 use \u201cCopy my answers\u201d below and send them to us instead.";
          offerFallback(host,payload,r);
        });
    };
  } else {
    host.appendChild(el("p",null,"Nothing has left your browser. Copy your answers, or open an email with them already filled in, and we will come back to you with the plan."));
  }
  offerFallback(host,payload,r);

  document.getElementById("foot").textContent =
    "Lead reference "+r.lead_score+" · confidence "+r.confidence+" · nothing here promises a result.";
}

restore();
render();
})();
</script>
</body>
</html>
